<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Hijacking Analysis</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1>Cookie Hijacking Analysis</h1>
        <p> Laborator demonstrues për analizimin e session cookies
            dhe mekanizmave të mbrojtjes në aplikacionet web.</p>

        <section class="card">
            <h2>Section Cookie Test</h2>
            <button id="createSession">
                Create Test Session
            </button>
            <p id="sessionResult">
                No session created yet
            </p>
        </section>
        <section class="card">
            <h2>Cookie Information</h2>

            <button id="readCookie">
                Read cookies
            </button>
            <pre id="cookieResult">No cookies read yet</pre>
        </section>
    </main>
    <script src="/js/main.js"></script>
</body>
</html>
